name: Discord feature updates

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      title:
        description: Feature name
        required: true
        default: Sunnie Planner update
      details:
        description: What changed
        required: false
        default: A new improvement is ready to try.

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    env:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
    steps:
      - name: Post update to Discord
        uses: actions/github-script@v7
        with:
          script: |
            const webhookUrl = process.env.DISCORD_RELEASE_WEBHOOK;
            if (!webhookUrl) {
              core.warning("DISCORD_RELEASE_WEBHOOK is not configured; skipping announcement.");
              return;
            }

            const headCommit = context.payload.head_commit;
            const message = headCommit?.message ?? "";
            const [commitTitle, ...bodyLines] = message.split("\n");
            if (commitTitle.includes("[skip discord]")) {
              core.info("Commit requested that the Discord announcement be skipped.");
              return;
            }

            const inputs = context.payload.inputs ?? {};
            const title = inputs.title || commitTitle || "Sunnie Planner update";
            const details = inputs.details || bodyLines.join("\n").trim();
            const commitUrl = headCommit?.url
              ?? `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`;

            const payload = {
              username: "Sunnie Planner Updates",
              allowed_mentions: { parse: [] },
              embeds: [
                {
                  title: "🌞 Sunnie Planner update",
                  description: `**${title}**\n${details || "A new improvement was just added."}`,
                  url: commitUrl,
                  color: 16042075,
                  fields: [
                    {
                      name: "Open Sunnie Planner",
                      value: "https://sunnie-planner-prod.up.railway.app",
                      inline: true,
                    },
                    {
                      name: "Status",
                      value: context.eventName === "workflow_dispatch"
                        ? "Live now — ready to try!"
                        : "Deploying now — it may take Railway a few minutes.",
                      inline: true,
                    },
                  ],
                  footer: {
                    text: `Commit ${context.sha.slice(0, 7)}`,
                  },
                  timestamp: new Date().toISOString(),
                },
              ],
            };

            const response = await fetch(`${webhookUrl}?wait=true`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              core.setFailed(`Discord returned ${response.status}: ${await response.text()}`);
            }
