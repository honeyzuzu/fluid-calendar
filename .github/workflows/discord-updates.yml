name: Discord feature updates

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      title:
        description: User-facing headline
        required: true
      details:
        description: What people can do differently (plain language)
        required: true

permissions:
  contents: read
  deployments: read

jobs:
  announce:
    if: github.event_name == 'workflow_dispatch' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    env:
      DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
    steps:
      - name: Post update to Discord
        uses: actions/github-script@v7
        with:
          script: |
            const webhookUrl = process.env.DISCORD_RELEASE_WEBHOOK;
            if (!webhookUrl) {
              core.warning("DISCORD_RELEASE_WEBHOOK is not configured; skipping announcement.");
              return;
            }

            const deployment = context.payload.deployment;
            const sha = deployment?.sha || context.sha;
            let title;
            let details;

            if (context.eventName === "workflow_dispatch") {
              title = context.payload.inputs?.title?.trim();
              details = context.payload.inputs?.details?.trim();
            } else {
              const commit = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });
              const message = commit.data.commit.message;
              if (message.split("\n", 1)[0].includes("[skip discord]")) {
                core.info("Commit requested that the Discord announcement be skipped.");
                return;
              }
              // Keep release copy separate from technical commit text. Both fields are
              // required so an empty body never becomes a vague announcement.
              const releaseTitle = message.match(/^Discord-Title:[ \t]*([^\r\n]+)/m);
              const releaseDetails = message.match(/^Discord-Details:[ \t]*([^\r\n]+)/m);
              if (!releaseTitle || !releaseDetails) {
                core.info("No Discord release copy on this commit; skipping announcement.");
                return;
              }
              title = releaseTitle[1].trim();
              details = releaseDetails[1].trim();
            }

            if (!title || !details) {
              core.warning("Discord title and details are both required; skipping announcement.");
              return;
            }

            const appUrl = "https://sunnie-planner-prod.up.railway.app";
            const safe = (value) => value.replace(/@/g, "@\u200b");
            const payload = {
              username: "Sunnie Planner Updates",
              allowed_mentions: { parse: [] },
              embeds: [{
                title: `☀️ ${safe(title).slice(0, 250)}`,
                description: safe(details).slice(0, 3900),
                url: appUrl,
                color: 16042075,
                fields: [{ name: "Open Sunnie", value: appUrl }],
              }],
            };
            const response = await fetch(`${webhookUrl}?wait=true`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            if (!response.ok) {
              core.setFailed(`Discord returned ${response.status}: ${await response.text()}`);
            }
