services:
  app:
    image: eibrahim/fluid-calendar:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    # Pin the container's bind address and port so unrelated PORT/HOSTNAME values
    # in the operator's .env cannot change them (env_file is overridden by
    # environment). The Next.js standalone server binds to HOSTNAME:PORT, so this
    # keeps the 3000:3000 publish pointed at a reachable, listening server.
    # See issue #151.
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Containers reach Postgres by its Compose service name. Local Next.js
      # instead uses the 127.0.0.1:5433 URL from .env.
      - DATABASE_URL=postgresql://sunnie_local:sunnie_local@db:5432/sunnie_local
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=sunnie_local
      - POSTGRES_PASSWORD=sunnie_local
      - POSTGRES_DB=sunnie_local
    ports:
      # A non-default host port makes the development database easy to
      # distinguish from PostgreSQL installations and production tunnels.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunnie_local -d sunnie_local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_dev_data:
